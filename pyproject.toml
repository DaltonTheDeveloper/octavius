[project]
name = "robloxforge"
version = "0.1.0"
description = "An AI pipeline that automates Roblox game development end-to-end: market research, game design, Luau engineering, UI/UX, QA, and free user acquisition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Core deps are intentionally light: the default backend drives the `claude` CLI,
# so no Anthropic SDK / API key is needed unless you opt into the `api` backend.
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
api = ["anthropic>=0.49"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
forge = "robloxforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robloxforge"]

[tool.ruff]
line-length = 100
target-version = "py310"
